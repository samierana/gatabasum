name: 04 - Scheduled Cron Job

# This workflow demonstrates scheduled execution using POSIX cron syntax.
# GitHub Actions allows you to run workflows on a recurring schedule without manual triggers.
on:
  # Cron format:
  # ┌───────────── minute (0 - 59)
  # │ ┌───────────── hour (0 - 23)
  # │ │ ┌───────────── day of the month (1 - 31)
  # │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
  # │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  # │ │ │ │ │
  # * * * * *
  schedule:
    # Runs every day at 08:00 UTC (3:00 AM EST / 1:00 PM PKT)
    - cron: '0 8 * * *'

  # Always include workflow_dispatch so you can trigger and test scheduled workflows manually!
  workflow_dispatch:

jobs:
  daily-health-check:
    name: Daily Health & Maintenance Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run scheduled maintenance check
        run: |
          echo "=== Scheduled Run Details ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Current UTC Time: $(date -u)"
          echo "Repository: ${{ github.repository }}"

      - name: Quick Repository Health Scan
        run: |
          echo "Counting project source files:"
          find src tests -type f | wc -l
          echo "File inventory:"
          ls -lhR src tests
