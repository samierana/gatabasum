name: 02 - CI Test Matrix

# This workflow demonstrates continuous integration (CI) testing across multiple
# Python versions using GitHub Actions' strategy matrix.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Strategy matrix runs this job multiple times in parallel with different configurations
    strategy:
      fail-fast: false # Do not cancel remaining jobs if one matrix combination fails
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        # You can also matrix multiple OSes if desired:
        # os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      # Step 1: Check out repository source code so the runner can access it
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up the requested Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Display Python environment
      - name: Verify Python version
        run: |
          python --version
          which python

      # Step 4: Run unit tests using standard library unittest
      - name: Run test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
